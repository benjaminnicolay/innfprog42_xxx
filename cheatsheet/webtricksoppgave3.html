<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p <span id="average"></span></p>
    
    <script>

        const father_age = 37;

        const mother_age = 32;

        const daughter_age = 7;

        const son_age = 2;

        const average_age = (father_age + mother_age + daughter_age + son_age) / 4;

        document.getElementById("average").innerHTML = average_age;

    </script>
</body>
</html>
